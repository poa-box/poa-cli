  id_gt: String
}
enum Vote_orderBy { id proposal proposal__id proposal__proposalId proposal__creator proposal__creatorUsername proposal__proposer proposal__proposerUsername proposal__classesVersion proposal__title proposal__descriptionHash proposal__numOptions proposal__startTimestamp proposal__endTimestamp proposal__isHatRestricted proposal__status proposal__winningOption proposal__isValid proposal__wasExecuted proposal__executionFailed proposal__executionError proposal__winnerAnnouncedAt proposal__executedAt proposal__executedCallsCount proposal__createdAtBlock proposal__transactionHash voter voterUsername voterUser voterUser__id voterUser__address voterUser__joinMethod voterUser__membershipStatus voterUser__participationTokenBalance voterUser__totalVotes voterUser__totalTasksCompleted voterUser__totalTasksCancelled voterUser__totalTasksLostToExpiry voterUser__totalTasksReleased voterUser__totalModulesCompleted voterUser__totalClaimsAmount voterUser__totalPaymentsAmount voterUser__totalTokenRequestsAmount voterUser__firstSeenAt voterUser__firstSeenAtBlock voterUser__lastActiveAt voterUser__lastActiveAtBlock optionIndexes optionWeights classRawPowers votedAt votedAtBlock transactionHash }
type VotingClass {
  asset: Bytes!
  change: VotingClassChange!
  classIndex: Int!
  hatIds: [BigInt!]!
  id: String!
  isActive: Boolean!
  minBalance: BigInt!
  quadratic: Boolean!
  slicePct: Int!
  strategy: VotingClassStrategy!
  version: BigInt!
}
