}
enum VotingClass_orderBy { id hybridVoting hybridVoting__id hybridVoting__executor hybridVoting__thresholdPct hybridVoting__quorum hybridVoting__hats hybridVoting__createdAt hybridVoting__createdAtBlock hybridVoting__classVersion change change__id change__version change__logIndex change__classesHash change__numClasses change__changedAt change__changedAtBlock change__transactionHash version classIndex strategy slicePct quadratic minBalance asset hatIds isActive createdAt createdAtBlock transactionHash }
type _Block_ {
  hash: Bytes
  number: Int!
  timestamp: Int
}
type _Meta_ {
  block: _Block_!
}
