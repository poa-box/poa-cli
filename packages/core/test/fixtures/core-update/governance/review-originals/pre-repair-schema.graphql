}
enum Proposal_orderBy { id proposalId hybridVoting hybridVoting__id hybridVoting__executor hybridVoting__thresholdPct hybridVoting__quorum hybridVoting__hats hybridVoting__createdAt hybridVoting__createdAtBlock hybridVoting__classVersion creator creatorUsername creatorUser creatorUser__id creatorUser__address creatorUser__joinMethod creatorUser__membershipStatus creatorUser__participationTokenBalance creatorUser__totalVotes creatorUser__totalTasksCompleted creatorUser__totalTasksCancelled creatorUser__totalTasksLostToExpiry creatorUser__totalTasksReleased creatorUser__totalModulesCompleted creatorUser__totalClaimsAmount creatorUser__totalPaymentsAmount creatorUser__totalTokenRequestsAmount creatorUser__firstSeenAt creatorUser__firstSeenAtBlock creatorUser__lastActiveAt creatorUser__lastActiveAtBlock proposer proposerUsername classesVersion classesChange classesChange__id classesChange__version classesChange__logIndex classesChange__classesHash classesChange__numClasses classesChange__changedAt classesChange__changedAtBlock classesChange__transactionHash title descriptionHash metadata metadata__id metadata__description metadata__createdAt metadata__promotedFrom numOptions startTimestamp endTimestamp isHatRestricted restrictedHatIds status votes batchExecutions winningOption isValid wasExecuted executionFailed executionError winnerAnnouncedAt executedAt executedCallsCount createdAtBlock transactionHash }
type Query {
  _meta(block: Block_height): _Meta_
  ddvproposals(first: Int = 100, orderBy: DDVProposal_orderBy, orderDirection: OrderDirection, where: DDVProposal_filter, block: Block_height): [DDVProposal!]!
  directDemocracyVotingContract(id: ID!): DirectDemocracyVotingContract
  hybridVotingContract(id: ID!): HybridVotingContract
  organization(id: ID!): Organization
  proposals(first: Int = 100, orderBy: Proposal_orderBy, orderDirection: OrderDirection, where: Proposal_filter, block: Block_height): [Proposal!]!
}
type User {
  account: Account
  address: Bytes!
}
type Vote {
  classRawPowers: [BigInt!]!
  id: String!
  optionIndexes: [Int!]!
  optionWeights: [Int!]!
