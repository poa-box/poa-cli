input DDVProposal_filter {
  directDemocracyVoting: String
  id: String
  id_gt: String
  proposalId: BigInt
}
enum DDVProposal_orderBy { id proposalId directDemocracyVoting directDemocracyVoting__id directDemocracyVoting__executor directDemocracyVoting__thresholdPct directDemocracyVoting__quorum directDemocracyVoting__hats directDemocracyVoting__createdAt directDemocracyVoting__createdAtBlock proposer proposerUsername proposerUser proposerUser__id proposerUser__address proposerUser__joinMethod proposerUser__membershipStatus proposerUser__participationTokenBalance proposerUser__totalVotes proposerUser__totalTasksCompleted proposerUser__totalTasksCancelled proposerUser__totalTasksLostToExpiry proposerUser__totalTasksReleased proposerUser__totalModulesCompleted proposerUser__totalClaimsAmount proposerUser__totalPaymentsAmount proposerUser__totalTokenRequestsAmount proposerUser__firstSeenAt proposerUser__firstSeenAtBlock proposerUser__lastActiveAt proposerUser__lastActiveAtBlock title descriptionHash metadata metadata__id metadata__description metadata__createdAt metadata__promotedFrom numOptions startTimestamp endTimestamp isHatRestricted restrictedHatIds status votes batchExecutions winningOption isValid winnerAnnouncedAt executionFailed executionError cleanedAt createdAtBlock transactionHash }
type DDVVote {
  optionIndexes: [Int!]!
  optionWeights: [Int!]!
  voter: Bytes!
}
type DirectDemocracyVotingContract {
  ddvProposals(first: Int = 100, orderBy: DDVProposal_orderBy, orderDirection: OrderDirection, where: DDVProposal_filter): [DDVProposal!]!
  id: Bytes!
  organization: Organization!
  quorum: BigInt!
  thresholdPct: Int!
}
type HybridVotingContract {
  classVersion: BigInt!
  classesChange: VotingClassChange
  id: Bytes!
  organization: Organization!
  proposals(first: Int = 100, orderBy: Proposal_orderBy, orderDirection: OrderDirection, where: Proposal_filter): [Proposal!]!
  quorum: BigInt!
  thresholdPct: Int!
  votingClasses(first: Int = 100, orderBy: VotingClass_orderBy, orderDirection: OrderDirection, where: VotingClass_filter): [VotingClass!]!
}
enum OrderDirection { asc desc }
type Organization {
  directDemocracyVoting: DirectDemocracyVotingContract
  hybridVoting: HybridVotingContract
  id: Bytes!
  users(first: Int = 100): [User!]!
}
type Proposal {
  classesChange: VotingClassChange
  classesVersion: BigInt!
  createdAtBlock: BigInt!
  creatorUsername: String
  descriptionHash: Bytes!
  endTimestamp: BigInt!
  executionError: Bytes
  executionFailed: Boolean!
  hybridVoting: HybridVotingContract!
  id: String!
  isHatRestricted: Boolean!
  isValid: Boolean
  metadata: ProposalMetadata
  numOptions: Int!
  proposalId: BigInt!
  proposer: Bytes!
  proposerUsername: String
  restrictedHatIds: [BigInt!]
  startTimestamp: BigInt!
  status: ProposalStatus!
  title: String!
  transactionHash: Bytes!
  votes(first: Int = 100, orderBy: Vote_orderBy, orderDirection: OrderDirection, where: Vote_filter): [Vote!]!
  wasExecuted: Boolean!
  winningOption: BigInt
}
type ProposalMetadata {
  actionSummaries: [String!]
