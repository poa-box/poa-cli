# Projection retains exact field types/defaults, credential fields, relevant filters and ID ordering.
# Other entities/filters/enums are omitted; this fixture tests selection capability, not whole deployment.
# Public key fields are deliberately absent in this independently observed serving schema.
scalar Bytes
scalar BigInt

type Query {
  passkeyCredentials(skip: Int = 0, first: Int = 100, orderBy: PasskeyCredential_orderBy, orderDirection: OrderDirection, where: PasskeyCredential_filter, block: Block_height, subgraphError: _SubgraphErrorPolicy_! = deny): [PasskeyCredential!]!
}

type PasskeyCredential {
  id: String!
  account: PasskeyAccount!
  credentialId: Bytes!
  active: Boolean!
  signCount: BigInt!
  createdAt: BigInt!
  removedAt: BigInt
  blockNumber: BigInt!
}

type PasskeyAccount {
  id: Bytes!
  factory: PasskeyAccountFactory!
}

type PasskeyAccountFactory {
  id: Bytes!
}

input PasskeyCredential_filter {
  id_gt: String
  account: String
  credentialId: Bytes
}

enum PasskeyCredential_orderBy {
  id
}

enum OrderDirection {
  asc
  desc
}

enum _SubgraphErrorPolicy_ {
  allow
  deny
}

input Block_height {
  hash: Bytes
  number: Int
  number_gte: Int
}
